services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    volumes:
      - ${POSTGRES_DATA:-postgres_data}:/var/lib/postgresql/data
      - ${POSTGRES_INIT_SQL}:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  typesense:
    networks:
        - proxy
        - default
    image: typesense/typesense:0.25.2
    restart: on-failure
    ports:
      - ${TYPESENSE_PORT:-8108}:8108
    volumes:
      - ${TYPESENSE_DATA:-typesense_data}:/data
    command: '--data-dir /data --api-key=${TYPESENSE_API_KEY} --enable-cors'
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8108 && printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"\\\"ok\\\":true\" <&3'"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 1s
  core:
    stop_grace_period: 1s
    networks:
        - proxy
        - default
    build: .
    ports:
      - ${SERVER_PORT:-45426}:${SERVER_PORT:-45426}
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      typesense:
        condition: service_healthy
        
volumes:
  postgres_data:
  typesense_data:

networks:
  proxy:
#    external: true
